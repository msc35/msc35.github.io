<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guidera — App Store Screenshots</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #1A1814; }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

  /* Viewport scaling — preview the 1320×2868 artboards at a reasonable size */
  #stage {
    display: flex; gap: 40px; padding: 60px 40px 140px;
    overflow-x: auto; align-items: flex-start;
    min-height: 100vh;
  }
  #stage::-webkit-scrollbar { height: 12px; }
  #stage::-webkit-scrollbar-track { background: #0a0a0a; }
  #stage::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 6px; }

  .frame-wrap {
    flex-shrink: 0;
    display: flex; flex-direction: column; gap: 14px;
    align-items: center;
  }
  .frame-scale {
    transform-origin: top left;
    box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
  }
  .frame-label {
    font-family: 'Geist Mono', monospace; font-size: 13px;
    color: rgba(250,247,242,0.6); letter-spacing: 0.08em;
  }

  /* Toolbar */
  #toolbar {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 100; display: flex; gap: 8px; align-items: center;
    background: rgba(26,24,20,0.9); backdrop-filter: blur(20px);
    padding: 10px 14px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.08);
    font-family: 'Geist', sans-serif;
  }
  #toolbar button {
    background: rgba(255,255,255,0.06); color: #FAF7F2;
    border: none; padding: 10px 16px; border-radius: 8px;
    font-family: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer; display: flex; align-items: center; gap: 8px;
  }
  #toolbar button:hover { background: rgba(255,255,255,0.12); }
  #toolbar button.primary { background: #C8553D; }
  #toolbar button.primary:hover { background: #d46951; }
  #toolbar .divider { width: 1px; height: 22px; background: rgba(255,255,255,0.1); margin: 0 4px; }
  #toolbar label { color: rgba(250,247,242,0.7); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  #toolbar select, #toolbar input[type="range"] {
    background: rgba(255,255,255,0.06); border: none; color: #FAF7F2;
    padding: 6px 8px; border-radius: 6px; font-family: inherit; font-size: 13px;
  }

  #status {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 100; padding: 12px 20px; border-radius: 10px;
    background: rgba(15,76,58,0.95); color: #FAF7F2;
    font-family: 'Geist Mono', monospace; font-size: 13px;
    opacity: 0; transition: opacity 0.2s;
    pointer-events: none;
  }
  #status.show { opacity: 1; }
</style>
</head>
<body>

<div id="toolbar">
  <label>Zoom
    <input type="range" id="zoom" min="10" max="50" value="22" step="1">
    <span id="zoomVal" style="color:#FAF7F2;min-width:34px;text-align:right">22%</span>
  </label>
  <div class="divider"></div>
  <button id="exportOne">Export current</button>
  <button id="exportAll" class="primary">Export all 9 PNGs</button>
</div>

<div id="stage"></div>
<div id="status"></div>

<!-- Dependencies -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/html-to-image@1.11.11/dist/html-to-image.js"></script>

<script type="text/babel" src="copy.jsx"></script>
<script type="text/babel" src="frame.jsx"></script>
<script type="text/babel" src="frames.jsx"></script>

<script type="text/babel">
// ─────────────────────────────────────────────
// Mount 9 frames into the stage
// ─────────────────────────────────────────────
function App() {
  return (
    <>
      {window.FRAMES.map((F, i) => (
        <div key={i} className="frame-wrap">
          <div className="frame-scale" data-export-root data-idx={i}>
            <F />
          </div>
          <div className="frame-label">{String(i+1).padStart(2,'0')} · 1320 × 2868</div>
        </div>
      ))}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('stage')).render(<App />);

// ─────────────────────────────────────────────
// Zoom
// ─────────────────────────────────────────────
const zoom = document.getElementById('zoom');
const zoomVal = document.getElementById('zoomVal');
function applyZoom() {
  const z = zoom.value / 100;
  document.querySelectorAll('.frame-scale').forEach(el => {
    el.style.transform = `scale(${z})`;
    // Reserve space for the scaled element
    el.style.width = '1320px';
    el.style.height = '2868px';
    el.parentElement.style.width = (1320 * z) + 'px';
    el.parentElement.style.height = (2868 * z + 30) + 'px';
  });
  zoomVal.textContent = zoom.value + '%';
}
zoom.addEventListener('input', applyZoom);
setTimeout(applyZoom, 200);

// ─────────────────────────────────────────────
// Export
// ─────────────────────────────────────────────
function status(msg) {
  const s = document.getElementById('status');
  s.textContent = msg;
  s.classList.add('show');
  clearTimeout(status._t);
  status._t = setTimeout(() => s.classList.remove('show'), 2500);
}

async function exportFrame(idx) {
  const el = document.querySelectorAll('[data-export-root]')[idx];
  // Reset transform for capture
  const prev = el.style.transform;
  el.style.transform = 'scale(1)';
  el.parentElement.style.width = '1320px';
  el.parentElement.style.height = '2898px';
  await new Promise(r => setTimeout(r, 100));

  const dataUrl = await htmlToImage.toPng(el, {
    width: 1320, height: 2868,
    pixelRatio: 1,
    cacheBust: true,
    skipAutoScale: true,
  });

  // Restore
  applyZoom();

  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = `guidera-appstore-${String(idx+1).padStart(2,'0')}.png`;
  a.click();
  return dataUrl;
}

document.getElementById('exportOne').addEventListener('click', async () => {
  status('Exporting frame 1…');
  await exportFrame(0);
  status('Exported frame 1.');
});

document.getElementById('exportAll').addEventListener('click', async () => {
  for (let i = 0; i < 9; i++) {
    status(`Exporting ${i+1} / 9…`);
    await exportFrame(i);
    await new Promise(r => setTimeout(r, 400));
  }
  status('All 9 exported. Check your downloads.');
});
</script>

</body>
</html>
