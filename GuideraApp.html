<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guidera — Raw Frames</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #1A1814; }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

  /* Stack of 9 frames at full 1320x2868 — no toolbar, no scaling, no buttons.
     Total canvas: 9 frames × 1320 wide + 8 gaps × 80 = 12,520 px wide */
  #stage {
    display: flex; gap: 80px;
    padding: 80px;
    width: max-content;
  }
  .frame-wrap { flex-shrink: 0; }
</style>
</head>
<body>

<div id="stage"></div>

<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" style="background:#FAF7F2;width:100%;height:100%">
  <rect x="90" y="50" width="120" height="200" rx="24" fill="#0F4C3A"/>
  <circle cx="150" cy="150" r="32" fill="#C8553D"/>
</svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="copy.jsx"></script>
<script type="text/babel" src="frame.jsx"></script>
<script type="text/babel" src="frames.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <>
      {window.FRAMES.map((F, i) => (
        <div key={i} className="frame-wrap"><F /></div>
      ))}
    </>
  );
}
ReactDOM.createRoot(document.getElementById('stage')).render(<App />);
</script>

</body>
</html>
